name: cpu-only-ci

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "assets/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "assets/**"

permissions:
  contents: read

jobs:
  first-visit-path:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the CLI without runtime dependencies
        run: python -m pip install -e .
      - name: Confirm the portable core imports with no dependencies installed
        run: python -m kvprobe report examples/evidence/pass-v0.3.json
      - name: Install the test-only schema validator
        run: python -m pip install -e '.[test]'
      - name: Compile Python sources
        run: python -m compileall -q kvprobe scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Exercise the README path without a GPU
        run: >-
          python -m kvprobe first-visit
          --output-dir /tmp/kvprobe-first-visit
