name: Bug report
description: A wrong verdict, a failing command, or a documentation path that does not work.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste raw logs, `docker inspect` output, `provenance.txt` or evidence bundles.** They carry
        hostnames, usernames, internal addresses, paths and tokens. Reduce the problem and sanitize it.
        Security problems — including any way to make a gate pass on evidence that does not support it —
        go through the repository's private vulnerability reporting (see SECURITY.md), not this form.
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      placeholder: python3 -m kvprobe report examples/evidence/pass-all-attempts.json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: The verdict, output or behaviour you expected, and why (link the document that says so if there is one).
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: What happened instead — sanitized output only.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Smallest reproduction
      description: A minimal, sanitized input (for example an evidence document cut down to the failing part), or the steps from a clean clone.
  - type: input
    id: versions
    attributes:
      label: Version fields
      description: Package version, evidence schema_version and assessment_version (see docs/VERSIONING.md), and Python version.
      placeholder: "0.1.0.dev0 / schema 0.3.0 / assessment 0.6.0 / Python 3.12"
    validations:
      required: true
  - type: checkboxes
    id: sanitized
    attributes:
      label: Sanitization
      options:
        - label: I removed hostnames, usernames, internal addresses, private paths, image digests and tokens from everything above.
          required: true
