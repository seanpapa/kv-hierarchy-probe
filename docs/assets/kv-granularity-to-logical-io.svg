<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">From model geometry to logical storage I/O</title>
  <desc id="description">A worked Qwen2.5-32B example shows a 16-token vLLM block of 4 MiB. In the examined LMCache configuration, sixteen vLLM blocks form one 64 MiB chunk, one cache identity, one memory object, and one logical descriptor. In the examined Dynamo KVBM path, one vLLM block remains one KVBM block, while layout determines whether it is represented by one 4 MiB descriptor or 128 descriptors of 32 KiB. Logical descriptor geometry does not determine NVMe command geometry.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #526174; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 1.2px; fill: #526174; }
      .lane-title { font-size: 20px; font-weight: 700; }
      .box-title { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #526174; }
      .metric { font-size: 26px; font-weight: 700; }
      .common { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; }
      .lm-box { fill: #eff6ff; stroke: #75a5d1; stroke-width: 1.4; }
      .kvbm-box { fill: #fff7ed; stroke: #d89a69; stroke-width: 1.4; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .divider { stroke: #cbd5e1; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#ffffff"/>
  <text x="58" y="58" class="eyebrow">KV GRANULARITY AND LOGICAL I/O</text>
  <text x="58" y="105" class="title">From model geometry to logical storage I/O</text>
  <text x="58" y="137" class="subtitle">The same vLLM KV block can become different cache objects and descriptor layouts</text>

  <rect x="58" y="176" width="1324" height="154" rx="12" class="common"/>
  <text x="84" y="207" class="eyebrow">WORKED EXAMPLE — NOT A CONSTANT</text>
  <text x="84" y="243" class="box-title">Qwen2.5-32B · 64 layers · 8 global KV heads · head dimension 128 · BF16 · TP=1</text>
  <text x="84" y="279" class="body">2 (K,V) × 64 × 8 × 128 × 2 bytes ÷ 1</text>
  <text x="498" y="280" class="metric" fill="#2563a6">256 KiB / token / rank</text>
  <path d="M837 264 H922" class="arrow"/>
  <text x="950" y="251" class="small">vLLM block_size = 16 tokens</text>
  <text x="950" y="284" class="metric">4 MiB / vLLM block</text>
  <text x="84" y="310" class="small">Change the model, KV dtype, tensor parallelism, or block size and these values change.</text>

  <text x="58" y="377" class="lane-title" fill="#2563a6">Examined LMCache configuration</text>
  <text x="386" y="377" class="small">chunk_size = 256 tokens</text>
  <rect x="58" y="399" width="228" height="132" rx="10" class="lm-box"/>
  <text x="82" y="438" class="box-title">16 vLLM blocks</text><text x="82" y="472" class="body">16 × 4 MiB</text><text x="82" y="501" class="small">256 tokens total</text>
  <path d="M286 465 H337" class="arrow"/>
  <rect x="340" y="399" width="228" height="132" rx="10" class="lm-box"/>
  <text x="364" y="438" class="box-title">1 LMCache chunk</text><text x="364" y="472" class="metric" fill="#2563a6">64 MiB</text><text x="364" y="501" class="small">external-cache object</text>
  <path d="M568 465 H619" class="arrow"/>
  <rect x="622" y="399" width="270" height="132" rx="10" class="lm-box"/>
  <text x="646" y="438" class="box-title">1 cache identity</text><text x="646" y="472" class="body">1 CacheEngineKey</text><text x="646" y="501" class="body">1 MemoryObj</text>
  <path d="M892 465 H943" class="arrow"/>
  <rect x="946" y="399" width="436" height="132" rx="10" class="lm-box"/>
  <text x="970" y="438" class="box-title">1 logical payload descriptor</text><text x="970" y="472" class="metric" fill="#2563a6">1 × 64 MiB</text><text x="970" y="501" class="small">The backend may add separate metadata operations.</text>

  <line x1="58" y1="566" x2="1382" y2="566" class="divider"/>
  <text x="58" y="610" class="lane-title" fill="#a54b1b">Examined Dynamo KVBM v1.0.1 path</text>
  <text x="415" y="610" class="small">page_size follows the vLLM block size; descriptor geometry depends on memory layout</text>
  <rect x="58" y="632" width="228" height="142" rx="10" class="kvbm-box"/>
  <text x="82" y="673" class="box-title">1 vLLM block</text><text x="82" y="710" class="metric" fill="#a54b1b">4 MiB</text><text x="82" y="742" class="small">16 tokens</text>
  <path d="M286 703 H337" class="arrow"/>
  <rect x="340" y="632" width="272" height="142" rx="10" class="kvbm-box"/>
  <text x="364" y="673" class="box-title">1 KVBM block</text><text x="364" y="710" class="body">1 SequenceHash identity</text><text x="364" y="742" class="small">same total payload: 4 MiB</text>
  <path d="M612 676 H684" class="arrow"/><path d="M612 733 H684" class="arrow"/>
  <rect x="687" y="624" width="695" height="70" rx="10" class="kvbm-box"/>
  <text x="711" y="653" class="box-title">Contiguous → contiguous</text><text x="1057" y="653" class="metric" fill="#a54b1b">1 × 4 MiB</text><text x="711" y="680" class="small">one logical descriptor</text>
  <rect x="687" y="706" width="695" height="76" rx="10" class="kvbm-box"/>
  <text x="711" y="736" class="box-title">Layer-separated GPU → contiguous storage</text><text x="1170" y="736" class="metric" fill="#a54b1b">128 × 32 KiB</text><text x="711" y="766" class="small">64 layers × K/V sides; total payload remains 4 MiB</text>

  <rect x="58" y="817" width="1324" height="53" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="82" y="850" class="body"><tspan font-weight="700">Boundary:</tspan> logical descriptor geometry does not determine NVMe command geometry; lower layers may split, merge, queue, or reschedule requests.</text>
</svg>
